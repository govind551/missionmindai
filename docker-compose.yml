version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: missionmind-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: missionmind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: missionmind-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/missionmind_db
      - JWT_SECRET_KEY=missionmind-ai-super-secret-jwt-key-for-aerospace-security-2026
      - LLM_PROVIDER=gemini
      - EMBEDDING_PROVIDER=local
      - FRONTEND_URL=http://localhost:5173
      - BACKEND_URL=http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/generated_reports:/app/generated_reports

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: missionmind-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
